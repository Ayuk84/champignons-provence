<!DOCTYPE html>

<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Champignons PROVENCE</title>

<style>

body {

  margin:0;

  font-family:Arial,sans-serif;

  background:#f4f0e6;

  color:#293b2b;

}

header {

  background:#244b35;

  color:white;

  text-align:center;

  padding:30px 15px;

}

header h1 {font-size:28px;margin:0 0 10px}

header p {margin:0}

main {

  max-width:650px;

  margin:25px auto;

  padding:20px;

}

.card {

  background:white;

  padding:24px;

  border-radius:15px;

  box-shadow:0 3px 12px #0001;

}

button {

  display:block;

  width:100%;

  padding:15px;

  margin:12px 0;

  border:0;

  border-radius:9px;

  background:#356b49;

  color:white;

  font-size:17px;

  cursor:pointer;

}

button:hover {background:#244b35}

.secondary {background:#777}

#result {line-height:1.6}

footer {

  text-align:center;

  padding:20px;

  font-size:13px;

}

</style>

</head>

<body>

<header>

<h1>🍄 Champignons PROVENCE</h1>

<p>Guide mycologique de Provence</p>

</header>

<main>

<div class="card">

<div id="app">

<h2>Bienvenue !</h2>

<p>Découvrez les principaux champignons de Provence grâce à notre clé de détermination.</p>

<p>Observez votre champignon avant de commencer.</p>

<button onclick="start()">Commencer la détermination</button>

</div>

</div>

</main>

<footer>

Guide pédagogique – Champignons de Provence

</footer>

<script>

const questions = [

{

q:"Où avez-vous trouvé votre champignon ?",

a:[

["Dans une forêt de pins","pin"],

["Sous des chênes ou des feuillus","feuillus"],

["Dans une prairie ou un pré","prairie"],

["Dans un autre milieu","autre"]

]

},

{

q:"Quelle est la forme du dessous du chapeau ?",

a:[

["Des tubes, comme une éponge","tubes"],

["Des lamelles fines","lamelles"],

["Des plis ou des veines","plis"],

["Des aiguillons","aiguillons"],

["Je ne sais pas","inconnu"]

]

},

{

q:"Quelle est la couleur dominante du chapeau ?",

a:[

["Brun ou marron","brun"],

["Rouge ou orangé","rouge"],

["Blanc ou crème","blanc"],

["Jaune","jaune"],

["Autre couleur","autre"]

]

},

{

q:"Le pied possède-t-il un anneau ?",

a:[

["Oui","oui"],

["Non","non"],

["Je ne sais pas","inconnu"]

]

}

];

let step=0;

let answers=[];

function start(){

step=0;

answers=[];

showQuestion();

}

function showQuestion(){

const q=questions[step];

document.getElementById("app").innerHTML=`

<h2>${q.q}</h2>

<p>Étape ${step+1} sur ${questions.length}</p>

${q.a.map((a,i)=>`

<button onclick="answer('${a[1]}')">${a[0]}</button>

`).join("")}

<button class="secondary" onclick="back()">Retour</button>

`;

}

function answer(value){

answers.push(value);

step++;

if(step<questions.length) showQuestion();

else showResult();

}

function back(){

if(step>0){

step--;

answers.pop();

showQuestion();

}

}

function showResult(){

let milieu=answers[0];

let dessous=answers[1];

let couleur=answers[2];

let anneau=answers[3];

let pistes=[];

if(dessous==="tubes"){

pistes.push("Famille des bolets : bolet bai, cèpe de Bordeaux, bolet à pied rouge et autres bolets.");

}

if(dessous==="lamelles"){

pistes.push("Famille des champignons à lamelles : russules, lactaires, amanites, agarics et cortinaires.");

}

if(dessous==="plis"){

pistes.push("Famille des chanterelles : girolles et espèces voisines.");

}

if(dessous==="aiguillons"){

pistes.push("Famille des hydnes : notamment le pied-de-mouton.");

}

if(milieu==="pin"){

pistes.push("Les forêts de pins provençales abritent notamment des lactaires, des bolets et des chanterelles.");

}

if(milieu==="feuillus"){

pistes.push("Les chênaies et forêts de feuillus abritent notamment des cèpes, des amanites et des russules.");

}

if(milieu==="prairie"){

pistes.push("Les prairies accueillent notamment des agarics et des marasmes.");

}

document.getElementById("app").innerHTML=`

<div id="result">

<h2>🍄 Votre première orientation</h2>

<p>Selon vos observations, voici quelques familles à examiner :</p>

${pistes.map(p=>`<p>• ${p}</p>`).join("")}

<p><b>Couleur :</b> ${couleur}</p>

<p><b>Anneau :</b> ${anneau}</p>

<p><b>Milieu :</b> ${milieu}</p>

<hr>

<h3>⚠️ Attention importante</h3>

<p>Cette clé donne uniquement des pistes de détermination. Elle ne permet pas d'identifier avec certitude un champignon ni de garantir sa comestibilité.</p>

<p>Ne consommez jamais un champignon sur la base de cette application. Faites vérifier toute récolte par un pharmacien formé en mycologie ou un mycologue compétent.</p>

<button onclick="start()">Nouvelle détermination</button>

</div>`;

}

</script>

</body>

</html>
